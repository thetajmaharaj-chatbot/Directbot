name: Directbot Long-tail Directory Engine

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1,4"

permissions:
  contents: write

jobs:
  discover-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Discover long-tail directories
        run: python discovery.py
      - name: Audit seeded directories
        run: python directbot.py
      - name: Save discovery and audit state
        run: |
          git config user.name "directbot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ output/ || true
          git diff --cached --quiet || git commit -m "bot: refresh long-tail directory intelligence"
          git push
