name: Directbot Directory Audit

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1,4"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python directbot.py
      - name: Save audit results
        run: |
          git config user.name "directbot"
          git config user.email "actions@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "bot: update directory audit"
          git push
