name: Directbot Account Preview
on:
  workflow_dispatch:
    inputs:
      registration_url:
        description: "Directory registration URL"
        required: true
        type: string
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - run: python accounts.py "${{ inputs.registration_url }}"
      - run: |
          git config user.name "directbot"
          git config user.email "actions@users.noreply.github.com"
          git add data/account-ledger.json
          git diff --cached --quiet || git commit -m "bot: update account registration state"
          git push
